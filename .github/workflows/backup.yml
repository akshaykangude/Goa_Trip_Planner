name: 🧾 Backup trip data (every 2 hours)

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours (UTC). GitHub may start scheduled runs a few minutes late.
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: trip-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Is it OK to store bills in this repo?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OPT_IN: ${{ vars.BACKUP_IN_REPO }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" = "true" ] || [ "$OPT_IN" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repo is PUBLIC, so bills are not committed here (anyone could read them)."
            echo "::notice::Your private Google Drive snapshots every 2h still run. To store here anyway, add the repo variable BACKUP_IN_REPO=true."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install Excel writer
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet openpyxl

      - name: Pull shared data → CSV / Excel / JSON
        if: steps.gate.outputs.run == 'true'
        env:
          TRIP_API_URL: ${{ secrets.TRIP_API_URL }}
          TRIP_PASSCODE: ${{ secrets.TRIP_PASSCODE }}
        run: python scripts/backup.py

      - name: Commit backup (only if something changed)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "trip-backup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "🧾 Backup $(TZ=Asia/Kolkata date '+%d %b %H:%M IST') [skip ci]"
          git pull --rebase --quiet || true
          git push
